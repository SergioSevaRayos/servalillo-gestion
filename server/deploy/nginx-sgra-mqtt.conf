# /etc/nginx/stream.d/sgra-mqtt.conf  (requiere libnginx-mod-stream y
# `stream { include /etc/nginx/stream.d/*.conf; }` al final de /etc/nginx/nginx.conf)
#
# Broker MQTT de SGRA: Nodo B (LoRa) y placas SIM7600E publican en sgra-aljibe.duckdns.org:1883,
# que apunta a este VPS; se reenvía por Tailscale al Mosquitto del NAS.

server {
    listen 1883;
    listen [::]:1883;
    proxy_pass 100.97.218.44:1883;
    proxy_connect_timeout 5s;
    # Más que el keepalive MQTT del firmware, para no cortar sesiones inactivas.
    proxy_timeout 10m;
}
