# /etc/nginx/sites-available/servalillo  (enlazar en sites-enabled y quitar el default)
#
# Sustituye  servalillo.example.com  por tu dominio y  /var/www/servalillo  por APP_DIR.
# certbot --nginx  añade luego el bloque 443 y el redirect; este fichero es el punto de partida.

server {
    listen 80;
    listen [::]:80;
    server_name servalillo.example.com;

    root /var/www/servalillo/server/public;
    index index.php;

    charset utf-8;

    # Firmas en PNG base64 + PDFs — margen de sobra.
    client_max_body_size 8M;

    # Compresión de respuestas de texto.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Cabeceras de seguridad básicas.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets versionados por Vite (nombre con hash) → caché agresiva.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # No servir dotfiles ni el resto del repo.
    location ~ /\.(?!well-known).* { deny all; }

    error_log  /var/log/nginx/servalillo.error.log;
    access_log /var/log/nginx/servalillo.access.log;
}
