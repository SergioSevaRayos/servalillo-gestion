# /etc/nginx/sites-available/sgra  (enlazar en sites-enabled)
#
# Proxy público del dashboard SGRA (NAS de casa, sin puertos abiertos en el router):
# internet → VPS → Tailscale → NAS 100.97.218.44:8090. Ver docs/04-despliegue-vps.md, "Proxy SGRA".
# El MQTT (1883) va aparte, en /etc/nginx/stream.d/sgra-mqtt.conf (nginx-sgra-mqtt.conf).

# Compatibilidad con la URL histórica http://sgra-aljibe.duckdns.org:8090
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    client_max_body_size 8M;

    location / {
        proxy_pass http://100.97.218.44:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/sgra.access.log;
    error_log  /var/log/nginx/sgra.error.log;
}

# https://sgra.geosafety.es — certbot --nginx -d sgra.geosafety.es añade el 443 y el redirect.
server {
    listen 80;
    listen [::]:80;
    server_name sgra.geosafety.es;

    client_max_body_size 8M;

    location / {
        proxy_pass http://100.97.218.44:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/sgra.access.log;
    error_log  /var/log/nginx/sgra.error.log;
}
